name: build
on: push

env:
  GODOT_VERSION: 4.7.2   # must match the image tag
  EXPORT_NAME: kar-game
  ITCH_TARGET: akankshch/kar-game

jobs:
  export:
    runs-on: ubuntu-24.04
    container: barichello/godot-ci:4.7.2
    strategy:
      matrix:
        include:
          - { preset: "Windows Desktop", dir: windows, file: kar-game.exe }
          - { preset: "Linux",       dir: linux,   file: kar-game.x86_64 }
          - { preset: "Web",       dir: web,   file: index.html }
    steps:
      - uses: actions/checkout@v4
      - name: Setup templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
      - name: Export
        run: |
          mkdir -p build/${{ matrix.dir }}
          godot --headless --export-release "${{ matrix.preset }}" build/${{ matrix.dir }}/${{ matrix.file }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dir }}
          path: build/${{ matrix.dir }}

  itchio-upload:
    needs: export
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { dir: web, channel: html5 }
          - { dir: windows, channel: windows }
          - { dir: linux, channel: linux }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.dir }}
          path: build/${{ matrix.dir }}

      - name: Setup butler
        uses: remarkablegames/setup-butler@v3

      # https://itch.io/docs/butler/pushing.html
      - name: Upload ${{ matrix.dir }} export to itch.io
        run: butler push build/${{ matrix.dir }} ${{ env.ITCH_TARGET }}:${{ matrix.channel }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
